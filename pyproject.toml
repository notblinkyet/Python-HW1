[project]
name = "dz-catalog-analysis-chicherin-m26-555-clone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yaroslav Chicherin", email = "y.chicherin@vkteam.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dz-catalog-analysis-chicherin-m26-555-clone = "dz_catalog_analysis_chicherin_m26_555_clone:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []